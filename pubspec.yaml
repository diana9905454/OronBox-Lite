name: oronbox_lite
description: "OronBox Lite - Standalone wearable management tool for VelaOS and ZeppOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  go_router: ^17.3.0
  flutter_riverpod: ">=2.5.0 <3.0.0"
  url_launcher: ^6.3.1
  dynamic_color: ">=1.7.0 <2.0.0"
  dio: ^5.8.0
  csv: ^8.0.0
  html: ^0.15.6

  cupertino_icons: ^1.0.8
  freezed_annotation: ^2.4.0
  json_annotation: ">=4.0.0 <4.12.0"
  segmented_list:
    path: packages/segmented_list
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  universal_ble: ">=1.0.0 <2.0.0"
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  pointycastle: ^4.0.0
  crypto: ^3.0.6
  file_picker: ^12.0.0
  cross_file: ^0.3.5+2
  archive: ^4.0.6
  image: ^4.5.4
  charset: ^2.0.1
  enough_convert: ^1.6.0
  logging: ^1.3.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.6
  desktop_drop: ^0.8.0
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  ffi: ^2.1.4
  web: ^1.1.1
  flutter_markdown_plus: ^1.0.12
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ">=2.4.0 <2.15.2"
  freezed: ^2.5.0
  json_serializable: ">=6.0.0 <6.15.1"

dependency_overrides:
  freezed_annotation: ^2.4.0
  jni: 1.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/team/
    - assets/images/devices/
    - assets/images/brands/
    - assets/licenses/
    - assets/legal/
